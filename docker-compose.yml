# -----------------------------------------------------------------------------
# ClinicPlus — production-style single-host deployment with Docker Compose.
#
#   cp .env.example .env        # then set POSTGRES_PASSWORD, JWT_SECRET, APP_BASE_URL ...
#   docker compose up -d --build
#
# Services: postgres → migrate (one-shot) → api → web (nginx :8080, published on WEB_PORT)
# Optional profiles:
#   --profile storage   MinIO (S3-compatible object storage) + bucket bootstrap
#   --profile av        ClamAV malware scanner for uploads
#   --profile demo      one-shot demo data seed (dev/sales demos only)
# See docs/DEPLOYMENT.md for the full guide.
# -----------------------------------------------------------------------------
name: clinicplus

x-api-image: &api-image
  image: ${API_IMAGE:-clinicplus-api:local}
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: runtime

# Environment shared by the API and the migration job. Secrets come from .env (never committed).
x-api-env: &api-env
  NODE_ENV: production
  PORT: "3000"
  LOG_LEVEL: ${LOG_LEVEL:-log}
  TRUST_PROXY: "true"
  DATABASE_URL: postgresql://${POSTGRES_USER:-clinicplus}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-clinicplus}?schema=public
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (>= 32 random chars)}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-1h}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
  LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
  LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
  # Must be a valid URL when set (empty string fails validation) → defaults to APP_BASE_URL.
  API_PUBLIC_URL: ${API_PUBLIC_URL:-${APP_BASE_URL:-http://localhost}}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
  ACCESS_SYNC_ON_BOOT: ${ACCESS_SYNC_ON_BOOT:-true}
  CURRENCY: ${CURRENCY:-INR}
  DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Kolkata}
  MAX_JSON_BODY_MB: ${MAX_JSON_BODY_MB:-2}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  UPLOAD_DIR: /app/storage/uploads
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  MALWARE_SCAN: ${MALWARE_SCAN:-off}
  CLAMAV_HOST: ${CLAMAV_HOST:-}
  CLAMAV_PORT: ${CLAMAV_PORT:-3310}
  BACKUP_DIR: /app/backups
  BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
  BACKUP_SCHEDULE_ENABLED: ${BACKUP_SCHEDULE_ENABLED:-true}
  BACKUP_HOUR_LOCAL: ${BACKUP_HOUR_LOCAL:-2}
  BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
  SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
  REMINDER_INTERVAL_MINUTES: ${REMINDER_INTERVAL_MINUTES:-15}
  MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
  MAIL_API_KEY: ${MAIL_API_KEY:-}
  MAIL_FROM: ${MAIL_FROM:-}
  MESSAGING_PROVIDER: ${MESSAGING_PROVIDER:-console}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
  TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
  PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-none}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinicplus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-clinicplus}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published by default. For local admin access use docker-compose.dev.yml
    # (binds 127.0.0.1:${POSTGRES_PUBLISH_PORT:-5432}).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: 256mb
    networks: [backend]

  # One-shot: applies pending Prisma migrations, then exits 0. The API waits for it.
  migrate:
    <<: *api-image
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - api_storage:/app/storage
      - api_backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 30s
    # The API is reached through the web container (/api); not published to the host.
    expose: ["3000"]
    networks: [backend, frontend]

  web:
    image: ${WEB_IMAGE:-clinicplus-web:local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:3000
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-25m}
      CSP_CONNECT_EXTRA: ${CSP_CONNECT_EXTRA:-}
      CSP_IMG_EXTRA: ${CSP_IMG_EXTRA:-}
      # Only trust X-Forwarded-For from a reverse proxy you run in front of this stack.
      REAL_IP_FROM: ${REAL_IP_FROM:-127.0.0.1/32}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [frontend]

  # ---- profile: storage (S3-compatible object storage) ----------------------
  # Use with STORAGE_DRIVER=s3, S3_ENDPOINT=http://minio:9000, S3_FORCE_PATH_STYLE=true,
  # S3_BUCKET/S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY matching the MINIO_* values below.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [storage]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clinicplus}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: [storage]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clinicplus}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
      S3_BUCKET: ${S3_BUCKET:-clinicplus}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET" &&
        echo "bucket $$S3_BUCKET ready (private)"
    networks: [backend]

  # ---- profile: av (malware scanning of uploads) ----------------------------
  # Use with MALWARE_SCAN=clamav, CLAMAV_HOST=clamav. First start downloads signatures (~minutes).
  clamav:
    image: clamav/clamav:1.4
    profiles: [av]
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    # frontend gives freshclam egress to download signature updates.
    networks: [backend, frontend]

  # ---- profile: demo (sample data; never on a real clinic database) ---------
  #   docker compose --profile demo run --rm seed
  seed:
    image: ${API_TOOLS_IMAGE:-clinicplus-api-tools:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: tools
    profiles: [demo]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clinicplus}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-clinicplus}?schema=public
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [backend]

networks:
  # backend is internal: postgres/minio/clamav have no route to or from the outside world.
  # The api additionally joins `frontend` for egress (Stripe/Twilio/S3/Sentry) and for web → api.
  backend:
    internal: true
  frontend: {}

volumes:
  postgres_data:
  api_storage:
  api_backups:
  minio_data:
  clamav_db:
