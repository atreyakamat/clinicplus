# -----------------------------------------------------------------------------
# ClinicPlus web — nginx server config TEMPLATE.
# Rendered at container start by the nginx image entrypoint (envsubst) into
# /etc/nginx/conf.d/default.conf. Only env vars defined in the container (API_UPSTREAM,
# CLIENT_MAX_BODY_SIZE, CSP_CONNECT_EXTRA, CSP_IMG_EXTRA, REAL_IP_FROM) are substituted;
# nginx runtime variables are written without braces ($host, $uri, ...).
# This file is included inside the `http {}` block, so `map` is allowed here.
# -----------------------------------------------------------------------------

# Scheme as seen by the browser: trust X-Forwarded-Proto from the ingress/LB, else our own.
map $http_x_forwarded_proto $clinicplus_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# HSTS only when the request reached us over TLS (TLS terminates at the ingress/LB).
map $clinicplus_proto $clinicplus_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# Content-Security-Policy for the SPA. Vite emits only external module scripts (no inline
# scripts), so script-src 'self' is enough. 'unsafe-inline' for styles is required by
# libraries that inject <style> tags (charts, toasts). Extend via CSP_CONNECT_EXTRA (e.g. a
# Sentry ingest host when VITE_SENTRY_DSN is set) and CSP_IMG_EXTRA.
map $host $clinicplus_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${CSP_IMG_EXTRA}; font-src 'self' data:; connect-src 'self' ${CSP_CONNECT_EXTRA}; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Real client IP from the trusted proxy in front of us (ingress controller / LB).
    # The API (TRUST_PROXY=true, 1 hop) then sees the real client in X-Forwarded-For,
    # which keeps per-IP login throttling meaningful.
    set_real_ip_from ${REAL_IP_FROM};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Uploads (documents, imports) go through /api; keep >= MAX_UPLOAD_MB on the API.
    client_max_body_size ${CLIENT_MAX_BODY_SIZE};

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    # Security headers (inherited by every location that has no add_header of its own).
    add_header Content-Security-Policy $clinicplus_csp always;
    add_header Strict-Transport-Security $clinicplus_hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Liveness/readiness for the container itself (does not touch the API).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API reverse proxy --------------------------------------------------
    # Same-origin API: the SPA calls /api/v1/... so no CORS is needed in the browser.
    # Provider webhooks (Stripe/Twilio) also arrive here; the body is passed through untouched,
    # so signature verification on the raw body keeps working.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append): $remote_addr is already the real client (see real_ip above).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $clinicplus_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        # Stream uploads to the API instead of buffering them to disk (read-only rootfs).
        proxy_request_buffering off;
        proxy_buffering on;

        # The API sets its own security headers (helmet); only HSTS is owned by nginx.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Powered-By;
        add_header Strict-Transport-Security $clinicplus_hsts always;
    }

    # Note: only /api/ is proxied; the API health endpoints (/health/*) are NOT reachable
    # through this server — probes hit the API pods directly.

    # ---- Static assets --------------------------------------------------------
    # Vite emits content-hashed file names under /assets → cache for a year.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # index.html must always be revalidated so new deployments are picked up.
    location = /index.html {
        expires -1;
    }

    # SPA history fallback: unknown paths render the app (client-side router).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
