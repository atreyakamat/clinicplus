apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Applied once by a cluster admin (after the namespace exists):
#   kubectl apply -k deploy/k8s/rbac
# The application's own ServiceAccount (clinicplus-app, in base/) has NO Role at all.
namespace: clinicplus

labels:
  - pairs:
      app.kubernetes.io/part-of: clinicplus
    includeSelectors: false

resources:
  - deployer.yaml
  - support.yaml
