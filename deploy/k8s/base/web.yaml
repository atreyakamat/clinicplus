apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinicplus-web
  labels:
    app.kubernetes.io/name: clinicplus-web
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clinicplus-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clinicplus-web
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: clinicplus-app
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: clinicplus-web
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: clinicplus-web
      containers:
        - name: web
          image: clinicplus-web # set per overlay via kustomize `images:`
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: API_UPSTREAM
              value: http://clinicplus-api:3000
            # Keep >= MAX_UPLOAD_MB and in line with the ingress proxy-body-size annotation.
            - name: CLIENT_MAX_BODY_SIZE
              value: 25m
            # Pod CIDR of the ingress controller, so nginx trusts its X-Forwarded-For.
            - name: REAL_IP_FROM
              value: 10.0.0.0/8
            - name: CSP_CONNECT_EXTRA
              value: ""
            - name: CSP_IMG_EXTRA
              value: ""
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # The image entrypoint renders the nginx template into conf.d at startup.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: nginx-conf
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: clinicplus-web
  labels:
    app.kubernetes.io/name: clinicplus-web
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clinicplus-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clinicplus-web
  labels:
    app.kubernetes.io/name: clinicplus-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clinicplus-web
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clinicplus-web
  labels:
    app.kubernetes.io/name: clinicplus-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clinicplus-web
