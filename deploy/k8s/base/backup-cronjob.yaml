# Nightly logical backup: pg_dump (custom format) → PVC, verified with pg_restore --list,
# then uploaded to s3://$S3_BUCKET/backups/ (BACKUP_TO_S3=true; or set BACKUP_S3_BUCKET to
# use a separate, write-only bucket). Local copies older than BACKUP_RETENTION_DAYS are
# pruned; S3 retention is a bucket lifecycle rule. Script: deploy/docker/api/backup.js.
# Run one now:  kubectl -n clinicplus create job --from=cronjob/clinicplus-backup backup-manual-$(date +%s)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clinicplus-backups
  labels:
    app.kubernetes.io/name: clinicplus-backup
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: clinicplus-backup
  labels:
    app.kubernetes.io/name: clinicplus-backup
    app.kubernetes.io/component: backup
spec:
  schedule: "0 2 * * *"
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: clinicplus-backup
            app.kubernetes.io/component: backup
            clinicplus.io/db-client: "true"
            clinicplus.io/egress-https: "true"
        spec:
          serviceAccountName: clinicplus-app
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: clinicplus-api # same image as the API (ships pg_dump 16)
              imagePullPolicy: IfNotPresent
              command: ["node", "/usr/local/lib/clinicplus/backup.js"]
              envFrom:
                - configMapRef:
                    name: clinicplus-config
                - secretRef:
                    name: clinicplus-secrets
              env:
                - name: BACKUP_DIR
                  value: /backups
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: clinicplus-backups
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
