# -----------------------------------------------------------------------------
# EXAMPLE ONLY — NOT referenced by any kustomization. Never commit real values.
#
# Provide a Secret named `clinicplus-secrets` in the namespace, one of:
#   a) External Secrets Operator (recommended): an ExternalSecret that syncs these keys from
#      AWS Secrets Manager / GCP Secret Manager / Vault into `clinicplus-secrets`
#      (example at the bottom of this file).
#   b) Sealed Secrets:  kubectl create secret generic clinicplus-secrets -n clinicplus \
#        --from-env-file=secrets.env --dry-run=client -o yaml | kubeseal -o yaml > sealed.yaml
#   c) Manually (small installs):
#        kubectl -n clinicplus create secret generic clinicplus-secrets --from-env-file=secrets.env
#
# Keys (all strings). Leave a key out rather than setting it to "" if it is a URL.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: clinicplus-secrets
  namespace: clinicplus
type: Opaque
stringData:
  # Prisma URL. Managed Postgres: add sslmode=require. Use a dedicated role (not superuser).
  DATABASE_URL: postgresql://clinicplus:CHANGE_ME@db.example.internal:5432/clinicplus?schema=public&sslmode=require
  # >= 32 random chars:  openssl rand -hex 32
  JWT_SECRET: CHANGE_ME_openssl_rand_hex_32
  # Object storage (omit both when using IRSA / Workload Identity)
  S3_ACCESS_KEY_ID: CHANGE_ME
  S3_SECRET_ACCESS_KEY: CHANGE_ME
  # Payments (PAYMENTS_PROVIDER=stripe in the ConfigMap)
  STRIPE_SECRET_KEY: sk_live_CHANGE_ME
  STRIPE_WEBHOOK_SECRET: whsec_CHANGE_ME
  # E-mail (MAIL_PROVIDER=resend|sendgrid and MAIL_FROM in the ConfigMap)
  MAIL_API_KEY: CHANGE_ME
  # Messaging (MESSAGING_PROVIDER=twilio in the ConfigMap)
  TWILIO_ACCOUNT_SID: ACCHANGE_ME
  TWILIO_AUTH_TOKEN: CHANGE_ME
  TWILIO_SMS_FROM: "+15550000000"
  TWILIO_WHATSAPP_FROM: whatsapp:+15550000000
  # Optional
  SENTRY_DSN: https://CHANGE_ME@o0.ingest.sentry.io/0
  BACKUP_ENCRYPTION_KEY: ""   # 64 hex chars, used by the in-app backup feature
---
