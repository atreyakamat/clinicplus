# Identity for every ClinicPlus pod. The app never talks to the Kubernetes API, so:
#  - no Role/RoleBinding exists for it (zero permissions), and
#  - the token is not mounted into pods.
# For cloud IAM (EKS IRSA / GKE Workload Identity) annotate this SA in an overlay.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clinicplus-app
  labels:
    clinicplus.io/phase: pre
automountServiceAccountToken: false
