apiVersion: v1
kind: Namespace
metadata:
  name: clinicplus
  labels:
    # Pod Security Admission: every pod in the namespace must satisfy the "restricted" profile.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Cluster-scoped: created by a cluster admin, skipped by the CI deployer
    # (kubectl apply -l 'clinicplus.io/admin-only!=true').
    clinicplus.io/admin-only: "true"
    clinicplus.io/phase: pre
