# Image tags for production — shared by the app overlay and the migrate overlay so the
# migration always runs the same build that is about to be rolled out.
# CI / release:  (cd deploy/k8s/overlays/production/images && \
#   kustomize edit set image clinicplus-api=ghcr.io/atreyakamat/clinicplus-api:<sha> \
#                            clinicplus-web=ghcr.io/atreyakamat/clinicplus-web:<sha>)
# Prefer immutable tags (git sha) or digests in production — never `latest`.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
images:
  - name: clinicplus-api
    newName: ghcr.io/atreyakamat/clinicplus-api
    newTag: set-me-to-a-git-sha
  - name: clinicplus-web
    newName: ghcr.io/atreyakamat/clinicplus-web
    newTag: set-me-to-a-git-sha
