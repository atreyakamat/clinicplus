apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinicplus-api
  namespace: clinicplus
spec:
  replicas: 3
  template:
    spec:
      topologySpreadConstraints:
        # Hard zone spread in production; hostname spread stays best-effort (from base).
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: clinicplus-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: clinicplus-api
      containers:
        - name: api
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=1024
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1536Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clinicplus-api
  namespace: clinicplus
spec:
  minReplicas: 3
  maxReplicas: 12
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clinicplus-web
  namespace: clinicplus
spec:
  minReplicas: 2
  maxReplicas: 6
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clinicplus-api
  namespace: clinicplus
spec:
  minAvailable: 2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clinicplus-backups
  namespace: clinicplus
spec:
  resources:
    requests:
      storage: 100Gi
