apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Staging: production topology at smaller scale (managed PostgreSQL, S3, TLS), base replica
# counts (2 api / 2 web) and HPA bounds. Use test-mode provider keys (sk_test_..., Twilio test creds).
namespace: clinicplus

resources:
  - ../../base

components:
  - images

configMapGenerator:
  - name: clinicplus-config
    behavior: merge
    envs:
      - config.env

patches:
  - path: networkpolicy-db.yaml
  - target:
      kind: Ingress
      name: clinicplus
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.clinic.example.com
      - op: replace
        path: /spec/rules/0/host
        value: staging.clinic.example.com
  - target:
      kind: PersistentVolumeClaim
      name: clinicplus-backups
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
