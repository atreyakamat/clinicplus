# In-cluster MinIO (S3-compatible) for the dev overlay only. Root credentials are the app's
# S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY from secrets.env.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clinicplus-minio
  labels:
    clinicplus.io/phase: pre
    app.kubernetes.io/name: clinicplus-minio
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clinicplus-minio
  labels:
    clinicplus.io/phase: pre
    app.kubernetes.io/name: clinicplus-minio
    app.kubernetes.io/component: object-storage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clinicplus-minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinicplus-minio
  labels:
    clinicplus.io/phase: pre
    app.kubernetes.io/name: clinicplus-minio
    app.kubernetes.io/component: object-storage
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume
  selector:
    matchLabels:
      app.kubernetes.io/name: clinicplus-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clinicplus-minio
        app.kubernetes.io/component: object-storage
    spec:
      serviceAccountName: clinicplus-app
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--certs-dir", "/tmp/certs"]
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: HOME
              value: /tmp
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: clinicplus-secrets
                  key: S3_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clinicplus-secrets
                  key: S3_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clinicplus-minio
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
# Creates the private bucket (idempotent). Re-runs whenever it is re-applied after its TTL.
apiVersion: batch/v1
kind: Job
metadata:
  name: clinicplus-minio-init
  labels:
    clinicplus.io/phase: pre
    app.kubernetes.io/name: clinicplus-minio-init
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clinicplus-minio-init
    spec:
      serviceAccountName: clinicplus-app
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >-
              mc alias set local http://clinicplus-minio:9000 "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" &&
              mc mb --ignore-existing "local/$S3_BUCKET" &&
              mc anonymous set none "local/$S3_BUCKET" &&
              echo "bucket $S3_BUCKET ready"
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: clinicplus-config
                  key: S3_BUCKET
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: clinicplus-secrets
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: clinicplus-secrets
                  key: S3_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
