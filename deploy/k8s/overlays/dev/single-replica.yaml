apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinicplus-api
  namespace: clinicplus
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinicplus-web
  namespace: clinicplus
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: web
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
---
# No autoscaling / disruption budgets on a single-replica dev cluster
# (a minAvailable=1 PDB with one replica would block node drains).
$patch: delete
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clinicplus-api
  namespace: clinicplus
---
$patch: delete
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clinicplus-web
  namespace: clinicplus
---
$patch: delete
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clinicplus-api
  namespace: clinicplus
---
$patch: delete
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clinicplus-web
  namespace: clinicplus
