name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Typecheck, lint (advisory), unit + e2e tests against PostgreSQL 16, builds.
  # ---------------------------------------------------------------------------
  verify:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinicos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clinicos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The e2e harness refuses any database whose name does not contain "test".
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinicos_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Typecheck API
        run: pnpm --filter api typecheck

      - name: Typecheck web
        run: pnpm --filter web typecheck

      # Advisory until the existing lint debt (thousands of findings) is paid down.
      - name: Lint (non-blocking)
        run: pnpm lint
        continue-on-error: true

      - name: Unit tests
        run: pnpm --filter api test

      - name: Apply migrations to the test database
        run: pnpm --filter api exec prisma migrate deploy

      - name: E2E tests
        run: pnpm --filter api test:e2e

      - name: Build API
        run: pnpm --filter api build

      - name: Build web
        run: pnpm --filter web build

  # ---------------------------------------------------------------------------
  # Kubernetes manifests: render every overlay with kustomize and validate the
  # output against the Kubernetes OpenAPI schemas. Also lint compose + scripts.
  # ---------------------------------------------------------------------------
  deploy-config:
    name: Validate deployment config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.6.7
      K8S_VERSION: 1.30.0
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Render kustomize overlays
        run: |
          set -euo pipefail
          cp deploy/k8s/overlays/dev/secrets.env.example deploy/k8s/overlays/dev/secrets.env
          mkdir -p rendered
          for env in dev staging production; do
            kubectl kustomize "deploy/k8s/overlays/$env" > "rendered/$env.yaml"
            kubectl kustomize "deploy/k8s/overlays/$env/migrate" > "rendered/$env-migrate.yaml"
          done
          kubectl kustomize deploy/k8s/rbac > rendered/rbac.yaml
          wc -l rendered/*.yaml

      - name: Validate manifests (kubeconform)
        run: kubeconform -strict -summary -kubernetes-version "$K8S_VERSION" rendered/*.yaml

      - name: Validate docker compose files
        env:
          POSTGRES_PASSWORD: ci-placeholder
          JWT_SECRET: ci-placeholder-ci-placeholder-ci-placeholder
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml --profile storage --profile av --profile demo config --quiet

      - name: Shellcheck deployment scripts
        run: shellcheck deploy/k8s/deploy.sh deploy/docker/api/*.sh

  # ---------------------------------------------------------------------------
  # Container images. Built on every run (catches Dockerfile breakage in PRs);
  # pushed to GHCR only from main, tagged with the full commit SHA and `latest`.
  # ---------------------------------------------------------------------------
  images:
    name: Image (${{ matrix.name }})
    needs: [verify, deploy-config]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/clinicplus-${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.name == 'api' && 'runtime' || '' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
